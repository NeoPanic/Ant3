[package]
name = "ant3-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[features]
test-support = []

[dependencies]
ant3-builtin-plugins = { path = "../../plugins" }
ant3-platform = { path = "../ant3-platform" }
ant3-models = { path = "../ant3-models" }
ant3-plugins = { path = "../ant3-plugins" }
ant3 = { path = "../ant3-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
