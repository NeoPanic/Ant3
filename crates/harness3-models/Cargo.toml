[package]
name = "harness3-models"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[dependencies]
harness3-domain = { path = "../harness3-domain" }
harness3 = { path = "../harness3-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
sha2 = "0.11"
toml = "1.2"
