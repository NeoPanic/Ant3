[package]
name = "ant3-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Local Ant³ control plane and inspection console"

[features]
test-support = []

[dependencies]
ant3-builtin-plugins = { path = "../../plugins" }
ant3-storage = { path = "../ant3-storage" }
ant3-domain = { path = "../ant3-domain" }
ant3-models = { path = "../ant3-models" }
ant3-plugins = { path = "../ant3-plugins" }
ant3 = { path = "../ant3-core" }
ant3-plugin-protocol = { path = "../ant3-plugin-protocol" }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
