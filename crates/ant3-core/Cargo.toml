[package]
name = "ant3"
version = "0.2.7"
edition = "2024"
rust-version = "1.99"
description = "Ant³: an ant-inspired Rust runtime for peer agents, durable sessions, and shared work"
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/NeoPanic/Ant3"
homepage = "https://github.com/NeoPanic/Ant3"
keywords = ["agent", "harness", "multi-agent", "llm", "runtime"]
categories = ["asynchronous"]


[dependencies]
serde_yaml_ng = "0.10"
sha2 = "0.11"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# Session history is append-only JSON; exact float round-trips are required
# so persisted tool receipts compare equal after reload (default parser drifts 1 ULP).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "macros", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }


[[example]]
name = "quickstart"
path = "../../examples/quickstart.rs"
