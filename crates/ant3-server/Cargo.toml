[package]
name = "ant3-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[dependencies]
ant3-builtin-plugins = { path = "../../plugins" }
ant3-client = { path = "../ant3-client" }
ant3-platform = { path = "../ant3-platform" }
ant3-domain = { path = "../ant3-domain" }
ant3-models = { path = "../ant3-models" }
ant3-worker = { path = "../ant3-worker" }
ant3-plugins = { path = "../ant3-plugins" }
ant3 = { path = "../ant3-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-std", "io-util", "process", "fs"] }
axum = "0.8"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ant3-worker = { path = "../ant3-worker", features = ["test-support"] }
ant3-platform = { path = "../ant3-platform", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
sha2 = "0.11"
ant3-plugin-protocol = { path = "../ant3-plugin-protocol" }
