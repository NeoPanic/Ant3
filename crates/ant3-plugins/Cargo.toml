[package]
name = "ant3-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[dependencies]
ant3 = { path = "../ant3-core" }
ant3-domain = { path = "../ant3-domain" }
ant3-plugin-protocol = { path = "../ant3-plugin-protocol" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "fs"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
